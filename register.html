<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Face - Face Recognition Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="static/css/style.css" rel="stylesheet" />
</head>
<body>
    <div class="main-content text-center py-5">
        <div class="mb-5">
            <h2 class="fw-bold mb-2">Register New User</h2>
            <p class="text-muted" style="color: var(--text-secondary) !important;">Add a new person to the attendance system.</p>
        </div>
        
        <div class="row justify-content-center g-4">
            <!-- Form Section -->
            <div class="col-lg-5">
                <div class="card h-100 p-4 border-0 text-start" style="border-radius: 25px; background: var(--bg-card);">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-4">
                            <div class="icon-box bg-primary bg-opacity-10 text-glow-primary d-inline-flex align-items-center justify-content-center me-3" style="width: 45px; height: 45px; border-radius: 12px;">
                                <i class="fa-solid fa-id-card"></i>
                            </div>
                            <h5 class="fw-bold mb-0">User Details</h5>
                        </div>
                        
                        <form id="registerForm">
                            <div class="mb-3">
                                <label class="form-label text-muted fw-bold small" style="color: var(--text-secondary) !important;">FULL NAME</label>
                                <input type="text" class="form-control form-control-lg bg-body text-body border-0 shadow-sm" style="border-radius: 12px;" id="name" placeholder="John Doe" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-muted fw-bold small" style="color: var(--text-secondary) !important;">STUDENT / EMPLOYEE ID</label>
                                <input type="text" class="form-control form-control-lg bg-body text-body border-0 shadow-sm" style="border-radius: 12px;" id="student_id" placeholder="ID12345" required>
                            </div>
                            
                            <div id="captureProgress" class="d-none mt-4 text-center">
                                <p class="mb-2 text-primary fw-bold" id="statusText"><i class="fa-solid fa-circle-notch fa-spin me-2"></i>Initializing AI...</p>
                                <div class="progress" style="height: 15px; border-radius: 10px; background-color: var(--bg-body);">
                                    <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                                </div>
                            </div>
                            
                            <div id="registerAlert" class="alert d-none mt-3" style="border-radius: 12px;"></div>

                            <button type="button" id="startCaptureBtn" class="btn btn-primary w-100 mt-4 py-3 fw-bold" style="border-radius: 15px; letter-spacing: 0.5px;">
                                <i class="fa-solid fa-camera me-2"></i>Start Registration
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Camera Section -->
            <div class="col-lg-7">
                <div class="card h-100 p-4 border-0" style="border-radius: 25px; background: var(--bg-card);">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center">
                        <div class="d-flex align-items-center w-100 mb-4 justify-content-start text-start">
                            <div class="icon-box text-glow-purple bg-opacity-10 d-inline-flex align-items-center justify-content-center me-3" style="width: 45px; height: 45px; border-radius: 12px; background-color: rgba(192, 132, 252, 0.1);">
                                <i class="fa-solid fa-video"></i>
                            </div>
                            <h5 class="fw-bold mb-0">Live Camera Feed</h5>
                        </div>
                    
                        <div class="video-container shadow-sm w-100" style="max-width: 500px; border-radius: 20px; overflow: hidden; background: #000; position: relative;">
                            <video id="videoElement" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
                            <canvas id="canvasOverlay" style="position: absolute; top:0; left:0; width:100%; height:100%; transform: scaleX(-1); pointer-events: none;"></canvas>
                        </div>
                        <div class="mt-4 text-center w-100" style="max-width: 500px;">
                            <p class="text-muted small mb-0 bg-secondary bg-opacity-10 p-3 rounded-4" style="color: var(--text-secondary) !important;">
                                <i class="fa-solid fa-circle-info text-primary me-2"></i>Please look straight into the camera. The AI will capture your facial features locally.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav active" id="bottomNav">
      <a href="index.html" class="bottom-nav-item" id="nav-dashboard">
        <i class="fa-solid fa-house"></i>
        Dashboard
      </a>
      <a href="register.html" class="bottom-nav-item active" id="nav-register">
        <i class="fa-solid fa-user-plus"></i>
        Register Face
      </a>
      <a href="recognize.html" class="bottom-nav-item" id="nav-recognize">
        <i class="fa-solid fa-camera"></i>
        Take Attendance
      </a>
      <a href="history.html" class="bottom-nav-item" id="nav-history">
        <i class="fa-solid fa-clipboard-list"></i>
        Records
      </a>
      <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Theme">
        <i class="fa-solid fa-sun" id="themeIcon"></i>
      </button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/face-api.min.js"></script>
    <script src="static/js/app-static.js"></script>
    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasOverlay');
        const startBtn = document.getElementById('startCaptureBtn');
        const alertBox = document.getElementById('registerAlert');
        const progressDiv = document.getElementById('captureProgress');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');

        let modelsLoaded = false;
        let isCapturing = false;

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                statusText.innerText = "Loading AI Models...";
                progressDiv.classList.remove('d-none');
                await app.initModels();
                modelsLoaded = true;
                progressDiv.classList.add('d-none');
            } catch (err) {
                console.error(err);
                alertBox.className = 'alert alert-danger d-block mt-3';
                alertBox.innerText = "Error: " + err.message;
            }
        }

        init();

        startBtn.addEventListener('click', async () => {
            const name = document.getElementById('name').value.trim();
            const studentId = document.getElementById('student_id').value.trim();

            if (!name || !studentId) {
                alertBox.className = 'alert alert-warning d-block mt-3';
                alertBox.innerText = "Please fill in all fields.";
                return;
            }

            if (!modelsLoaded) {
                alertBox.className = 'alert alert-info d-block mt-3';
                alertBox.innerText = "Please wait for models to load.";
                return;
            }

            isCapturing = true;
            startBtn.disabled = true;
            progressDiv.classList.remove('d-none');
            alertBox.classList.add('d-none');
            
            const descriptors = [];
            const maxFrames = 5;

            while (descriptors.length < maxFrames) {
                statusText.innerText = `Capturing face (${descriptors.length + 1}/${maxFrames})...`;
                const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
                
                if (detection) {
                    descriptors.push(detection.descriptor);
                    const percent = Math.round((descriptors.length / maxFrames) * 100);
                    progressBar.style.width = percent + '%';
                    progressBar.innerText = percent + '%';
                }
                await new Promise(r => setTimeout(r, 500));
            }

            try {
                await app.registerUser(name, studentId, descriptors);
                alertBox.className = 'alert alert-success d-block mt-3';
                alertBox.innerText = "Registration Successful!";
                document.getElementById('registerForm').reset();
            } catch (err) {
                alertBox.className = 'alert alert-danger d-block mt-3';
                alertBox.innerText = err.message;
            } finally {
                isCapturing = false;
                startBtn.disabled = false;
                progressDiv.classList.add('d-none');
            }
        });

        // Theme toggle logic
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'light') themeIcon.classList.replace('fa-sun', 'fa-moon');

        themeToggleBtn.addEventListener('click', () => {
            let currentTheme = document.documentElement.getAttribute('data-theme');
            let targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', targetTheme);
            localStorage.setItem('theme', targetTheme);
            if (targetTheme === 'dark') {
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }
        });
    </script>
</body>
</html>
